name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  # ── The rules that keep the codebase testable ──────────────────────────────
  quality:
    name: lint, types, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      # Strict only on domain/. That is where the money rules live, and it is
      # the one package with no I/O to make strictness awkward.
      - name: mypy --strict on domain/
        run: mypy app/domain

      # api -> services -> {domain, data}, and domain imports nothing.
      # Without this the layering erodes one convenient import at a time.
      - name: import-linter
        run: lint-imports

      # Architecture §17's first risk: float money reaching the database.
      - name: no floating point in domain/
        run: python scripts/check_no_float.py

      - name: permission seed matches the domain matrix
        run: python scripts/gen_permission_seed.py --check

      - name: TypeScript contract matches the Pydantic models
        run: python scripts/gen_ts_types.py --check

  # ── The Python suite, on both target and CI platforms ─────────────────────
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the deployment target; Ubuntu is where the RLS suite runs.
        # 3.12 is the floor the code actually supports, 3.14 is the version the
        # plan standardises on (and where uuid7 comes from the stdlib).
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        env:
          # Search the money properties far harder than the desk profile does.
          # A counterexample in the pricing engine is worth minutes of CI.
          HYPOTHESIS_PROFILE: ci
        run: pytest -q

  # ── RLS: the only layer that is actually security ─────────────────────────
  rls:
    name: row level security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest tests/test_rls.py
        env:
          POS_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        # -p no:randomly is not in play; the suite builds its schema once per
        # session and each test rolls back, so ordering does not matter.
        run: pytest tests/test_rls.py -v

  # ── The React shell ───────────────────────────────────────────────────────
  ui:
    name: ui build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      # The barcode capture timing hook (execution plan §15). Scanners are in
      # use, so this path is load-bearing rather than speculative.
      - name: test
        run: npm test
      - name: build
        run: npm run build
